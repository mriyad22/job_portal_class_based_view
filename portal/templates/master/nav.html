<style>
/* Nav link base */
.navbar .nav-link {
  position: relative;
  color: #ddd !important;
  transition: 0.3s;
}

/* Hover effect */
.navbar .nav-link:hover {
  color: #fff !important;
}

/* Underline animation */
.navbar .nav-link::after {
  content: '';
  position: absolute;
  width: 0%;
  height: 2px;
  bottom: 0;
  left: 0;
  background: #0d6efd;
  transition: 0.3s;
}

.navbar .nav-link:hover::after {
  width: 100%;
}

/* Active link */
.navbar .nav-link.active {
  color: #fff !important;
  font-weight: 600;
}

.navbar .nav-link.active::after {
  width: 100%;
}
</style>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <div class="me-1">
      <a class="navbar-brand fw-bold" href="{% url 'home' %}">
        <img src="https://i.imgur.com/epQXcJA.jpeg"
        class="rounded-5 border"
        style="width:50px; height:50px; object-fit:cover;" />
      </a>
      
    </div>

    {% comment %} <a class="navbar-brand fw-bold" href="{% url 'home' %}">MySite</a> {% endcomment %}

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">

      <!-- Left Menu -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'home' %}">
            Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link {% if request.path == '/job-list/' %}active{% endif %}" href="{% url 'jb_list' %}">
            All Jobs
          </a>
        </li>

        
        {% if request.user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/profile/' %}active{% endif %}" href="{% url 'profile' %}">
              profile
            </a>
          </li>
        {% endif %}
          

        
        
        
        
        
          

      </ul>

      <!-- Right Side -->
      <div class="d-flex align-items-center gap-2">

        <!-- Search -->
        <form class="d-flex" role="search">
          <input class="form-control me-2 rounded-pill" type="search" placeholder="Search">
          <button class="btn btn-outline-light rounded-pill" type="submit">Search</button>
        </form>

        <!-- Auth Button -->
        
        {% if request.user.is_authenticated %}
          <a href="{% url 'logout_page' %}" class="btn btn-primary rounded-pill px-3">Logout</a>

        {% else %}
          <a href="{% url 'login_page' %}" class="btn btn-primary rounded-pill px-3">Login</a>
          
        {% endif %}
          
        
        

      </div>
    </div>
  </div>
</nav>
