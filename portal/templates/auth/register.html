{% extends 'master/base.html' %}

{% block title %} User Registation {% endblock %}

{% block content %}
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <h2 class="text-center mb-4 text-primary fw-bold">
                    User Registration
                </h2>

                <form method="post" class="p-4 bg-white shadow rounded-4">
                    {% csrf_token %}
                    {{ data.as_p }}

                    

                    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-semibold">
                    Register
                    </button>

                    <div class="text-center mt-3">
                        <a href="{% url 'login_page' %}" class="text-decoration-none text-info fw-semibold">
                            Already have an account?
                        </a>
                    </div>

                </form>

            </div>
        </div>
    </div>
    
    <style>
        body {
            background: linear-gradient(135deg, #74ebd5, #9face6);
        }
    </style>

    
{% endblock %}
